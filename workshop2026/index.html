const D=()=>state.view==="rec"?R:S;

let state={view:"sessions",q:"",day:0,track:"",mine:false,mode:"list",at:null};

function hl(text){text=esc(text);const terms=state.q.trim().split(/\s+/).filter(w=>w.length>1);if(!terms.length)return text;
  const re=new RegExp("("+terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");return text.replace(re,"<mark>$1</mark>")}
function etNow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {y:+p.year,mo:+p.month,d:+p.day,min:+p.hour*60+ +p.minute}}
const fmt=m=>{let h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mm).padStart(2,"0")+" "+ap};
function recCard(s,cls,badge,on){

function card(s,cls,badge){const on=picks.has(s.id);if(s.kind)return recCard(s,cls,badge,on);
  return `<article class="card ${cls||""}"><button class="star" data-id="${s.id}" aria-pressed="${on}" aria-label="Save to My Picks">${on?"★":"☆"}</button>

  ${s.track?`<span class="track">${hl(s.track)}</span>`:""}</article>`}
function filtered(){const terms=state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return D().filter(s=>(!state.day||s.day===state.day)&&(state.view==="rec"||!state.track||s.track===state.track)&&(!state.mine||picks.has(s.id))&&terms.every(t=>s.hay.includes(t)))}
function renderList(){const r=filtered();let html="",last=null;

function renderNow(day,min,live){

  const allOn=base.filter(s=>s.day===day&&s.s<=min&&min<s.e);const isAllDay=s=>!s.kind&&s.e-s.s>=300&&!s.track;const on=allOn.filter(s=>!isAllDay(s));const open=allOn.filter(isAllDay);
