<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop 2026 Sessions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Searchable session list for NJSBA Workshop 2026, Oct 19-22, with a Happening Now view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: white brand header with district logo, navy nav band holding search and filters, light content area with square-cornered cards */
:root{--brand:#12329a;--band:#1a3575;--bandInk:#ffffff;--bandSoft:rgba(255,255,255,.14);--bandLine:rgba(255,255,255,.35);--plate:#ffffff;
--bg:#f2f4f8;--card:#ffffff;--ink:#16213d;--muted:#5a6478;--line:#d9dfea;--navy:#1a3575;--link:#12329a;--accent:#12329a;
--live:#1d7a4c;--liveBg:#e3f3ea;--soon:#8a5a00;--soonBg:#fcf0d4;--chip:#e9edf5;
--font:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--band:#152c63;--bg:#0e1526;--card:#172038;--ink:#e7ebf4;--muted:#9ba6bd;--line:#28344f;--navy:#9db2f0;--link:#a9bcff;--accent:#a9bcff;--live:#5cd197;--liveBg:#123022;--soon:#f0c25a;--soonBg:#332a12;--chip:#222d48;color-scheme:dark}}
:root[data-theme="dark"]{--band:#152c63;--bg:#0e1526;--card:#172038;--ink:#e7ebf4;--muted:#9ba6bd;--line:#28344f;--navy:#9db2f0;--link:#a9bcff;--accent:#a9bcff;--live:#5cd197;--liveBg:#123022;--soon:#f0c25a;--soonBg:#332a12;--chip:#222d48;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--plate);border-bottom:1px solid #e3e7ef}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
header img{height:58px;width:auto;display:block}
.event{text-align:right;color:#1a3575;min-width:0}
.event h1{margin:0;font-size:.95rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.event p{margin:2px 0 0;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#4a5878}
.navband{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--bandInk);box-shadow:0 2px 6px rgba(10,20,50,.18)}
.bar{padding-block:12px 10px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:11px 12px;border:0;border-radius:3px;background:#fff;color:#16213d}
.search input::placeholder{color:#6b7590}
.search input:focus{outline:3px solid #9db2f0;outline-offset:0}
.now{border:0;border-radius:3px;padding:0 16px;font:inherit;font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:#1a3575;cursor:pointer;white-space:nowrap}
.now:hover{background:#e6ecfa}
.now:focus-visible,.chip:focus-visible,.star:focus-visible,.addr:focus-visible,.dir:focus-visible{outline:3px solid #9db2f0;outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bandLine);background:transparent;color:var(--bandInk);border-radius:3px;padding:6px 12px;font:inherit;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chip:hover{background:var(--bandSoft)}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:#1a3575}
select.chip{appearance:none;padding-right:12px;max-width:190px;text-overflow:ellipsis}
@media (max-width:560px){header .wrap{gap:8px}header img{height:50px}.event{text-align:left;width:100%}.event h1{font-size:.85rem}.event p{font-size:.72rem}}
select.chip option{color:#16213d;text-transform:none}
.status{font-size:.82rem;color:var(--muted);margin:14px 0 4px;letter-spacing:.02em}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:2px;padding:14px 16px;margin:14px 0}
.panel h2{margin:0 0 6px;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.9rem}
.panel select,.panel input{font:inherit;font-size:.95rem;padding:7px 8px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.panel button{font:inherit;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:3px;border:1px solid var(--navy);background:transparent;color:var(--navy);cursor:pointer;font-weight:700}
.panel button#pGo{background:var(--brand);border-color:var(--brand);color:#fff}
h3.group{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--navy);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-bottom:10px}
.card.live{box-shadow:inset 4px 0 0 var(--live)}
.card.soon{box-shadow:inset 4px 0 0 var(--soon)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.room{background:var(--chip);border-radius:2px;padding:2px 8px;color:var(--ink);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:2px 7px}
.badge.live{background:var(--liveBg);color:var(--live)}
.badge.soon{background:var(--soonBg);color:var(--soon)}
.card h4{text-wrap:balance;margin:8px 0 6px;font-size:1.05rem;font-weight:700;line-height:1.3;color:var(--ink)}
.card .who{font-size:.86rem;margin:4px 0}
.card .desc{font-size:.9rem;color:var(--muted);margin:6px 0 0;max-width:68ch}
.track{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--link)}
.star{float:right;border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 0 0 8px}
.star[aria-pressed="true"]{color:var(--brand)}
:root:not([data-theme="light"]) .star[aria-pressed="true"]{color:var(--accent)}
mark{background:var(--soonBg);color:var(--ink);border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer{font-size:.75rem;color:var(--muted);padding:24px 0 40px;text-align:center;border-top:1px solid var(--line);margin-top:24px}
.badgeBox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qr{background:#fff;padding:10px;border:1px solid var(--line);border-radius:2px;width:min(260px,70vw)}
.qr svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.badgeNum{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.badgeInfo{font-size:.88rem;color:var(--muted);text-align:left;width:100%;max-width:420px}
.badgeInfo b{color:var(--ink)}
.addr{display:flex;flex-direction:column;gap:1px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);text-decoration:none;font-size:.88rem}
.addr span{color:var(--muted)}
.addr em{font-style:normal;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--link);margin-top:4px}
.addr:active{transform:scale(.99)}
.dir{display:inline-block;margin-top:8px;font-size:.8rem;font-weight:700;color:var(--link)}
.host{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:8px}
</style>
</head>

{"day": 20, "start": "4:30 PM", "end": "7:30 PM", "host": "Gorman, D'Anella & Morlok", "venue": "Chickie's & Pete's", "where": "Tropicana", "addr": "Tropicana Atlantic City, 2831 Boardwalk, Atlantic City, NJ 08401"}, {"day": 20, "start": "4:30 PM", "end": "6:30 PM", "host": "UBS", "venue": "The Balcony", "where": "Hard Rock Hotel", "addr": "Hard Rock Hotel & Casino Atlantic City, 1000 Boardwalk, Atlantic City, NJ 08401"}, {"day": 22, "start": "4:30 PM", "end": "6:30 PM", "host": "Fullmind", "venue": "Cuba Libre Restaurant & Rum Bar", "where": "Tropicana", "addr": "Tropicana Atlantic City, 2831 Boardwalk, Atlantic City, NJ 08401"}]).map((r,i)=>{const s=toMin(r.start);return {id:1000+i,kind:"rec",day:r.day,start:r.start,end:r.end,s,e:r.end?toMin(r.end):s+120,noEnd:!r.end,title:r.host,room:r.venue,where:r.where,addr:r.addr,
  hay:[r.host,r.venue,r.where,r.addr,"reception"].join(" ").toLowerCase()}}).sort((a,b)=>a.day-b.day||a.s-b.s);
const D=()=>state.view==="rec"?R:S;
const noun=()=>state.view==="rec"?"receptions":"sessions";
let state={view:"sessions",q:"",day:0,track:"",mine:false,mode:"list",at:null};
let picks=new Set();try{picks=new Set(JSON.parse(localStorage.getItem("ws26picks")||"[]"))}catch(e){}
const savePicks=()=>{try{localStorage.setItem("ws26picks",JSON.stringify([...picks]))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text){text=esc(text);const terms=state.q.trim().split(/\s+/).filter(w=>w.length>1);if(!terms.length)return text;
  const re=new RegExp("("+terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");return text.replace(re,"<mark>$1</mark>")}
function etNow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {y:+p.year,mo:+p.month,d:+p.day,min:+p.hour*60+ +p.minute}}
const fmt=m=>{let h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mm).padStart(2,"0")+" "+ap};
function recCard(s,cls,badge,on){
  const uber="https://m.uber.com/ul/?action=setPickup&pickup=my_location&"+encodeURIComponent("dropoff[nickname]")+"="+encodeURIComponent(s.room)+"&"+encodeURIComponent("dropoff[formatted_address]")+"="+encodeURIComponent(s.addr);
  const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.room+", "+s.addr);
  return `<article class="card ${cls||""}"><button class="star" data-id="${s.id}" aria-pressed="${on}" aria-label="Save to My Picks">${on?"★":"☆"}</button>
  <div class="meta">${badge||""}<span><b>${DAYS[s.day]}</b> · ${s.noEnd?s.start+" start (end time not listed)":s.start+" to "+s.end}</span></div>
  <div class="host">Hosted by</div><h4 style="margin-top:2px">${hl(s.title)}</h4>
  <a class="addr" href="${uber}" target="_blank" rel="noopener"><b>${hl(s.room)}</b><span>${esc(s.addr)}</span><em>Tap for an Uber here ↗</em></a>
  <a class="dir" href="${map}" target="_blank" rel="noopener">Map ↗</a></article>`}
function card(s,cls,badge){const on=picks.has(s.id);if(s.kind)return recCard(s,cls,badge,on);
  return `<article class="card ${cls||""}"><button class="star" data-id="${s.id}" aria-pressed="${on}" aria-label="Save to My Picks">${on?"★":"☆"}</button>
  <div class="meta">${badge||""}<span><b>${DAYS[s.day]}</b> · ${s.start} to ${s.end}</span><span class="room">${/^\d/.test(s.room)?"Room ":""}${esc(s.room)}</span></div>
  <h4>${hl(s.title)}</h4>
  ${s.speakers?`<div class="who"><b>Speakers:</b> ${hl(s.speakers)}</div>`:""}
  ${s.presentedBy?`<div class="who"><b>Presented by:</b> ${hl(s.presentedBy)}</div>`:""}
  ${s.description?`<p class="desc">${hl(s.description)}</p>`:""}
  ${s.track?`<span class="track">${hl(s.track)}</span>`:""}</article>`}
function filtered(){const terms=state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  return D().filter(s=>(!state.day||s.day===state.day)&&(state.view==="rec"||!state.track||s.track===state.track)&&(!state.mine||picks.has(s.id))&&terms.every(t=>s.hay.includes(t)))}
function renderList(){const r=filtered();let html="",last=null;
  r.forEach(s=>{if(s.day!==last){html+=`<h3 class="group">${DAYS[s.day]}</h3>`;last=s.day}html+=card(s)});
  $("list").innerHTML=html||`<div class="empty">No ${noun()} match. Try fewer or different words.</div>`;
  $("status").textContent=`${r.length} of ${D().length} ${noun()}`+(state.q?` matching "${state.q.trim()}"`:"")}
function renderNow(day,min,live){
  const base=D().filter(s=>(state.view==="rec"||!state.track||s.track===state.track)&&(!state.mine||picks.has(s.id)));
  const allOn=base.filter(s=>s.day===day&&s.s<=min&&min<s.e);const isAllDay=s=>!s.kind&&s.e-s.s>=300&&!s.track;const on=allOn.filter(s=>!isAllDay(s));const open=allOn.filter(isAllDay);
  const soon=base.filter(s=>s.day===day&&s.s>min&&s.s-min<=45);
  const label=`${DAYS[day]||"Oct "+day} at ${fmt(min)}`;
  let html=`<div class="panel"><h2>${state.view==="rec"?(live?"Receptions now":"Receptions at"):(live?"Happening now":"Sessions at")} · ${label}</h2>
    <div class="row">Check another time:
    <select id="pDay">${Object.entries(DAYS).map(([k,v])=>`<option value="${k}" ${+k===day?"selected":""}>${v}</option>`).join("")}</select>
    <input id="pTime" type="time" value="${String(Math.floor(min/60)).padStart(2,"0")}:${String(min%60).padStart(2,"0")}">
    <button id="pGo">Show</button><button id="pBack">Back to all</button></div></div>`;
  if(!DAYS[day]) html+=`<div class="empty">The conference runs Oct 19 to 22. Pick a day and time above to see what is on.</div>`;
  else{
    html+=`<h3 class="group">In progress (${on.length})</h3>`+(on.length?on.map(s=>card(s,"live",`<span class="badge live">${s.e-min} min left</span>`)).join(""):`<div class="empty">Nothing in progress at this time.</div>`);
    if(soon.length) html+=`<h3 class="group">Starting within 45 minutes (${soon.length})</h3>`+soon.map(s=>card(s,"soon",`<span class="badge soon">Starts in ${s.s-min} min</span>`)).join("");
    if(open.length) html+=`<h3 class="group">Open all day (${open.length})</h3>`+open.map(s=>card(s)).join("");
    if(!on.length&&!soon.length){const nxt=base.filter(s=>s.day===day&&s.s>min);if(nxt.length){const t=nxt[0].s;html+=`<h3 class="group">Next start: ${fmt(t)}</h3>`+nxt.filter(s=>s.s===t).map(s=>card(s,"soon")).join("")}}
  }
  $("nowPanel").innerHTML=html;$("nowPanel").hidden=false;$("list").innerHTML="";
  $("status").textContent=state.track||state.mine?"Filters applied: "+[state.track,state.mine?"My Picks":""].filter(Boolean).join(", "):"";
  $("pGo").onclick=()=>{const [h,m]=$("pTime").value.split(":");state.mode="now";state.at={day:+$("pDay").value,min:+h*60+ +m};render()};
  $("pBack").onclick=()=>{state.mode="list";render()};
}
function render(){if(state.mode==="now"){if(state.at)renderNow(state.at.day,state.at.min,false);else{const n=etNow();renderNow(n.mo===10?n.d:0,n.min,true)}}
  else{$("nowPanel").hidden=true;renderList()}}
$("dayChips").innerHTML=[[0,"All days"],...Object.entries(DAYS)].map(([k,v])=>`<button class="chip" data-day="${k}" aria-pressed="${+k===0}">${v}</button>`).join("");
$("dayChips").onclick=e=>{const b=e.target.closest("[data-day]");if(!b)return;state.day=+b.dataset.day;state.mode="list";
  document.querySelectorAll("[data-day]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("recBtn").onclick=()=>{state.view=state.view==="rec"?"sessions":"rec";const r=state.view==="rec";$("recBtn").setAttribute("aria-pressed",r);
  $("track").hidden=r;$("q").placeholder=r?"Search host, venue, hotel...":"Search title, speaker, topic, room...";
  render();window.scrollTo({top:0,behavior:"smooth"})};
const tracks=[...new Set(S.map(s=>s.track).filter(Boolean))].sort();
$("track").innerHTML=`<option value="">All tracks</option>`+tracks.map(t=>`<option>${esc(t)}</option>`).join("");
$("track").onchange=e=>{state.track=e.target.value;$("track").setAttribute("aria-pressed",!!state.track);render()};
$("mine").onclick=()=>{state.mine=!state.mine;$("mine").setAttribute("aria-pressed",state.mine);render()};
let tmr;$("q").oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{state.q=e.target.value;state.mode="list";render()},120)};
$("nowBtn").onclick=()=>{state.mode="now";state.at=null;render();window.scrollTo({top:0,behavior:"smooth"})};
document.addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const id=+b.dataset.id;picks.has(id)?picks.delete(id):picks.add(id);savePicks();render()});
setInterval(()=>{if(state.mode==="now"&&!state.at)render()},60000);
render();
</script>
</body>
</html>
